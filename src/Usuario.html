<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM-usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="usuario.css">
</head>
<body>

    <header class="menu-principal">
        <div class="menu-logo">CRM</div>
        
        <div class="barra-busca">
            <div class="circulo-icone-busca">
                <img src="search.png" alt="lupa">
            </div>
            <input type="text" placeholder="BUSCAR" class="campo-digitacao">
        </div>

        <div class="area-usuario">
            <button class="botao-notificacao">
                <img src="notifications.png" alt="Notificação">
            </button>
            <div class="foto-perfil-circulo">
                <img src="eu 1.png" alt="Usuário">
            </div>
        </div>
    </header>

</body>
</html>
