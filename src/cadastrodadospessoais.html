<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro-dados-pessoais</title>
    <link rel="stylesheet" href="/Floricultura-Landing-Page/src/style/cadastrese.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="bodypage">
    <div class="corpo-cadastro">
    
    <h1 class = "cadastrese" id="cadastrese">Cadastre-se</h1>
    <p class=" subtitulo" id = "subtitulo">Faça login para fazer a sua encomenda</p>
    <img  class = "rosacadastro" id = "rosacadastro" src="rosacadastro.png" alt="rosacadastro">
    
    <form id="formularioCadastro"> 
        <label for="nomeUsuarioDigitar" class="nomeUsuario" id="nomeUsuario">Nome</label>
        <input id="nomeUsuarioDigitar" class="nomeUsuarioDigitar" type="text" placeholder="Seu Nome">

        <label for="emailUsuarioDigitar" class="emailUsuario" id="emailUsuario">Email</label>
        <input id="emailUsuarioDigitar" class = "emailUsuarioDigitar" type="text" placeholder="Exemplo@email.com">

        <button class="buttonContinuar" type="submit">Continuar</button>

    </form>
    </div>

<script src="./script/cadastro.js"></script>

</body>
</html>
